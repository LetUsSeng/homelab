- name: Configure Proxmox nodes
  hosts: proxmox
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: "{{ proxmox_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Set up Tailscale
      ansible.builtin.include_role:
        name: tailscale
