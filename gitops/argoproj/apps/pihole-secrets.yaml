apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole-secrets
  namespace: argocd
spec:
  # only the InfisicalSecrets: pihole and external-dns themselves are installed by
  # scripts/install-pihole.sh and scripts/install-external-dns.sh
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/LetUsSeng/homelab
    targetRevision: master
    path: gitops/pihole/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
