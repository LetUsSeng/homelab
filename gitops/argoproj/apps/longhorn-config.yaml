apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-config
  namespace: argocd
spec:
  # extra storageclasses on top of the longhorn chart (installed by scripts/install-longhorn.sh)
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/LetUsSeng/homelab
    targetRevision: master
    path: gitops/longhorn-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
