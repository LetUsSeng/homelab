apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  # plain manifests, there's no official chart. See gitops/home-assistant/README.md.
  destination:
    namespace: home-assistant
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/LetUsSeng/homelab
    targetRevision: master
    path: gitops/home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
