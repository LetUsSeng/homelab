apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox
  namespace: argocd
spec:
  destination:
    namespace: proxmox
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/LetUsSeng/homelab
    targetRevision: master
    path: gitops/proxmox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
