admin:
  # created by scripts/bootstrap/bootstrap-monitoring-secrets.sh, then kept in sync from infisical by
  # manifests/infisical-secret.yaml. Without this the chart's default
  # adminPassword ("strongpassword") is used.
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# NOTE:
# the pvc is longhorn ReadWriteOnce, so a rolling update deadlocks whenever the new pod lands on
# another node: it waits for the volume, and the old pod holding it waits for the new one.
deploymentStrategy:
  type: Recreate

# restart when the infisical operator changes grafana-admin
annotations:
  secrets.infisical.com/auto-reload: "true"

# dashboards created in the ui live here; the provisioned ones below are read-only
persistence:
  enabled: true
  size: 5Gi
  storageClassName: longhorn

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.letusseng.com
  # no secretName: traefik serves its default *.letusseng.com cert
  tls:
    - hosts:
        - grafana.letusseng.com

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
      - name: InfluxDB
        type: influxdb
        uid: influxdb
        url: http://influxdb-influxdb2.monitoring.svc.cluster.local
        access: proxy
        # proxmox writes here, see gitops/monitoring/README.md
        jsonData:
          version: Flux
          organization: homelab
          defaultBucket: proxmox
        secureJsonData:
          token: ${INFLUXDB_TOKEN}

# the token is read from the same secret the influxdb chart uses, never from git
envValueFrom:
  INFLUXDB_TOKEN:
    secretKeyRef:
      name: influxdb-auth
      key: admin-token

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      # its own provider: the chart mounts a dashboard configmap over the whole provider directory,
      # which would hide the gnetId downloads in default
      - name: proxmox
        orgId: 1
        folder: Proxmox
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/proxmox

# built from gitops/grafana/manifests
dashboardsConfigMaps:
  proxmox: grafana-dashboards-proxmox

# pinned revisions, fetched from grafana.com at pod start
dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 41
      datasource: Prometheus
    kubernetes-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    kubernetes-namespaces:
      gnetId: 15758
      revision: 40
      datasource: Prometheus
    loki-logs:
      gnetId: 13639
      revision: 2
      datasource: Loki
