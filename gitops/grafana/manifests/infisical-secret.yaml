# grafana-admin, read by the chart through admin.existingSecret. Values live in infisical under
# homelab/prod/monitoring/grafana (keys admin-user, admin-password), see gitops/infisical/README.md.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-admin
spec:
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      # tofu -chdir=infra/tf/infisical output k8s_operator_identity_id
      identityId: cc879bbc-9496-4c7f-8b5e-2fc794fd5806
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: homelab
        envSlug: prod
        secretsPath: /monitoring/grafana
  managedKubeSecretReferences:
    - secretName: grafana-admin
      secretNamespace: monitoring
      creationPolicy: Owner
