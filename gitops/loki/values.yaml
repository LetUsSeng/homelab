# Single-node loki for homelab log volume. The chart defaults to SimpleScalable with memcached
# caches (chunks-cache alone asks for 8GB), so most of this file is turning that off.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # the chart ships an empty schemaConfig and refuses to start without one
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 336h # 14d
  # without the compactor nothing is ever deleted, whatever retention_period says
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: longhorn

# SimpleScalable components, unused in SingleBinary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# memcached caches: far too large for a homelab
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# alloy and grafana talk to the loki service directly
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
