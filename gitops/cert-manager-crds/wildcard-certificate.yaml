apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letusseng-com
  # traefik's default TLSStore serves this secret for every Ingress (gitops/traefik/values.yaml)
  namespace: traefik
spec:
  secretName: letusseng-com-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - letusseng.com
    - "*.letusseng.com"
