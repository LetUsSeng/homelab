# The identity every InfisicalSecret logs in as (kubernetesAuth.serviceAccountRef). The operator mints
# a short-lived token for it (autoCreateServiceAccountToken) and infisical checks that token with a
# TokenReview. infra/tf/infisical allows only this name in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-auth
---
# NOTE:
# infra/tf/infisical sets no token_reviewer_jwt, so infisical reviews the client's own token with
# itself, which needs the client to be allowed to call the TokenReview api.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-auth-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical-auth
    namespace: infisical-operator-system
