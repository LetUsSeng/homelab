# pihole-password, the pihole admin password under the key values.yaml reads, from infisical
# homelab/prod/pihole/admin (the same folder as pihole-admin, see gitops/pihole/manifests).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pihole-password
  namespace: external-dns
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # tofu -chdir=infra/tf/infisical output k8s_operator_identity_id
      identityId: cc879bbc-9496-4c7f-8b5e-2fc794fd5806
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: homelab
        envSlug: prod
        secretsPath: /pihole/admin
  managedKubeSecretReferences:
    - secretName: pihole-password
      secretNamespace: external-dns
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          EXTERNAL_DNS_PIHOLE_PASSWORD: "{{ .password.Value }}"
