# Mounted read-only at /config/configuration.yaml. Everything else in /config (.storage, ui-made
# automations, backups) lives on the pvc.
default_config:

# NOTE:
# No http block. Since 2026.9 home assistant keeps http settings in .storage/http and only imports
# yaml once, as a "pending" config that reverts unless an admin confirms it within 5 minutes, which
# can't happen before onboarding behind traefik. The reverse proxy settings live in http.json
# instead, see README.md.

recorder:
  # cnpg's generated home-assistant-db-app uri, see statefulset.yaml
  db_url: !env_var HA_DB_URL
  purge_keep_days: 14

# NOTE:
# No influxdb block. The integration is ui-configured now: yaml connection settings are imported
# once and then flagged as deprecated. See README.md for the one-time setup.

# created empty by the init container, the ui writes to them
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
