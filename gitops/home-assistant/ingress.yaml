apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
spec:
  ingressClassName: traefik
  rules:
    # published into pihole by external-dns
    - host: ha.letusseng.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: home-assistant
                port:
                  name: http
  # no secretName: traefik serves its default *.letusseng.com cert
  tls:
    - hosts:
        - ha.letusseng.com
