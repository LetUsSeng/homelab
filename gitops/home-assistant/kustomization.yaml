apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml

# keeps the name hash, so editing configuration.yaml renames the configmap and rolls the pod
# (it's mounted with subPath, which never picks up changes on its own)
configMapGenerator:
  - name: home-assistant-config
    files:
      - configuration.yaml
