# influxdb-auth, read by the chart (adminUser.existingSecret), by grafana (INFLUXDB_TOKEN) and by
# infra/tf/proxmox/metric-server. Values live in infisical under homelab/prod/monitoring/influxdb
# (keys admin-password, admin-token), see gitops/infisical/README.md.
# NOTE:
# influxdb only reads these on first init, so changing them in infisical does not rotate the real
# credentials; grafana (auto-reload) restarts and picks up the new token.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: influxdb-auth
  namespace: monitoring
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # tofu -chdir=infra/tf/infisical output k8s_operator_identity_id
      identityId: cc879bbc-9496-4c7f-8b5e-2fc794fd5806
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: homelab
        envSlug: prod
        secretsPath: /monitoring/influxdb
  managedKubeSecretReferences:
    - secretName: influxdb-auth
      secretNamespace: monitoring
      creationPolicy: Owner
