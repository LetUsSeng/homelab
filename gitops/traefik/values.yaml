# Traefik replaces ingress-nginx (deprecated). Chart defaults already create the
# `traefik` IngressClass as the cluster default and expose web (80) / websecure (443).
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# keep the two replicas on different nodes so a talos node reboot doesn't take ingress down
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik

providers:
  kubernetesIngress:
    # only these namespaces may reference ServersTransports (…@kubernetescrd) from Service annotations
    crossProviderNamespaces:
      - proxmox
      - vault

# all Ingresses are https-only; the *.letusseng.com default cert covers every host
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

# wildcard *.letusseng.com cert from cert-manager (gitops/cert-manager-crds), served for every Ingress.
# Until the secret exists traefik falls back to its self-signed cert.
tlsStore:
  default:
    defaultCertificate:
      secretName: letusseng-com-tls

service:
  annotations:
    # same IP the old ingress-nginx used
    metallb.io/loadBalancerIPs: 10.0.0.103
  spec:
    externalTrafficPolicy: Cluster
