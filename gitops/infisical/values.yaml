# Secrets manager at https://infisical.letusseng.com, see ./README.md.
infisical:
  # names every resource plain "infisical" (service infisical.infisical.svc)
  fullnameOverride: infisical

  # a single pod is enough: consumers keep their last synced k8s Secret while it restarts
  replicaCount: 1

  image:
    tag: "v0.165.12"

  # created by scripts/bootstrap/bootstrap-infisical-secrets.sh: ENCRYPTION_KEY, AUTH_SECRET,
  # DB_CONNECTION_URI, REDIS_URL, SITE_URL. db and redis are external (manifests/), so nothing else
  # is injected.
  kubeSecretRef: infisical-secrets

  # NOTE:
  # infisical refuses urls that resolve to private ips (ssrf guard), which rejects the kubernetes
  # auth host https://kubernetes.default.svc (infra/tf/infisical) with "Local IPs not allowed as
  # URL". Everything it talks to in this homelab is private anyway.
  extraEnv:
    - name: ALLOW_INTERNAL_IP_CONNECTIONS
      value: "true"

  # NOTE:
  # creates the admin user, the "homelab" org and an instance-admin machine identity on first sync,
  # then writes that identity's token into infisical-bootstrap-secret, which infra/tf/infisical reads.
  # Argo runs it as a PostSync hook every sync; --ignore-if-bootstrapped makes the re-runs no-ops.
  autoBootstrap:
    enabled: true
    organization: homelab
    # credentials from scripts/bootstrap/bootstrap-infisical-secrets.sh
    credentialSecret:
      name: infisical-bootstrap-credentials
    secretDestination:
      name: infisical-bootstrap-secret
    secretTemplate: '{"data":{"token":"{{.Identity.Credentials.Token}}","organization-id":"{{.Organization.ID}}"}}'

ingress:
  enabled: true
  ingressClassName: traefik
  hostName: infisical.letusseng.com
  nginx:
    enabled: false
  # no secretName: traefik serves its default *.letusseng.com cert
  tls:
    - hosts:
        - infisical.letusseng.com

# replaced by manifests/postgres-cluster.yaml (cloudnative-pg) and manifests/valkey.yaml
postgresql:
  enabled: false
redis:
  enabled: false
