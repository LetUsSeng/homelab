replicaCount: 1

# the config PVC is ReadWriteOnce, so the old pod has to release it before the new one starts
strategyType: Recreate

image:
  tag: ""

# DNS (53 tcp+udp) is the only thing exposed directly on the LAN
serviceDns:
  mixedService: true
  type: LoadBalancer
  port: 53
  externalTrafficPolicy: Cluster
  annotations:
    metallb.io/loadBalancerIPs: 10.0.0.101
    # published into pihole by external-dns
    external-dns.kubernetes.io/hostname: dns.letusseng.com

# the router at 10.0.0.1 keeps handing out DHCP leases
serviceDhcp:
  enabled: false

# the web ui goes through the traefik ingress
serviceWeb:
  http:
    enabled: true
    port: 80
  https:
    enabled: false
  type: ClusterIP

virtualHost: pi.hole

ingress:
  enabled: true
  ingressClassName: traefik
  annotations: {}
  path: /
  pathType: ImplementationSpecific
  hosts:
    # virtualHost (default value is pi.hole) will be appended to the hosts
    - pihole.letusseng.com
  # no secretName: traefik serves its default *.letusseng.com cert
  tls:
    - hosts:
        - pihole.letusseng.com

persistentVolumeClaim:
  enabled: true

  # -- Annotations for the `PersitentVolumeClaim`
  annotations: {}

  accessModes:
    - ReadWriteOnce
  size: "4096Mi"
  storageClass: "longhorn"

# -- Use an existing secret for the admin password.
admin:
  # -- If set to false admin password will be disabled, adminPassword specified above and the pre-existing secret (if specified) will be ignored.
  enabled: true
  # -- Specify an existing secret to use as admin password
  existingSecret: "pihole-admin"
  # -- Specify the key inside the secret to use
  passwordKey: "password"
  # -- Specify [annotations](docs/Values.md#admin.annotations) to be added to the secret
  annotations:
    # reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    # reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "external-dns"

doh:
  enabled: false
  envVars:
    DOH_UPSTREAM: "https://1.1.1.1/dns-query"

# pihole-FTL settings, rendered as FTLCONF_<key> env vars
ftl:
  # local domain for the lan
  dns_domain_name: letusseng.com

# letusseng.com is a LAN-only zone served by pihole
dnsmasq:
  customDnsEntries:
    # letusseng.com and every subdomain -> traefik, so new ingresses need no dns change
    - address=/letusseng.com/10.0.0.103

  # hosts entries take precedence over the wildcard above
  additionalHostsEntries:
    - 10.0.0.100 k8s.letusseng.com
    - 10.0.0.201 pve-0.letusseng.com
    - 10.0.0.202 pve-1.letusseng.com
    - 10.0.0.203 pve-2.letusseng.com
    - 10.0.0.24 talos-control-plane-0.letusseng.com
    - 10.0.0.28 talos-control-plane-1.letusseng.com
    - 10.0.0.29 talos-control-plane-2.letusseng.com

adlists: {}

whitelist: {}

blacklist: {}

regex: {}

# public upstreams only, so pointing the router's dns at pihole can't create a loop
DNS1: "1.1.1.1"
DNS2: "1.0.0.1"

podDnsConfig:
  enabled: true
  policy: "None"
  nameservers:
    - 127.0.0.1
    - 1.1.1.1
