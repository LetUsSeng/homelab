# The pihole admin password, from infisical homelab/prod/pihole/admin (key password), see
# gitops/infisical/README.md. Synced by the pihole-secrets argo app; the charts themselves are still
# installed by scripts/install-pihole.sh and scripts/install-external-dns.sh.
#
# pihole-admin: FTLCONF_webserver_api_password, which pihole applies at startup
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pihole-admin
  namespace: pihole
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # tofu -chdir=infra/tf/infisical output k8s_operator_identity_id
      identityId: cc879bbc-9496-4c7f-8b5e-2fc794fd5806
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: homelab
        envSlug: prod
        secretsPath: /pihole/admin
  managedKubeSecretReferences:
    - secretName: pihole-admin
      secretNamespace: pihole
      creationPolicy: Owner
---
# the same password for external-dns, under the key its values.yaml reads. Replaces the one-off copy
# in scripts/install-external-dns.sh, so a changed password reaches external-dns too.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pihole-password
  namespace: external-dns
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      # tofu -chdir=infra/tf/infisical output k8s_operator_identity_id
      identityId: cc879bbc-9496-4c7f-8b5e-2fc794fd5806
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical-operator-system
      secretsScope:
        projectSlug: homelab
        envSlug: prod
        secretsPath: /pihole/admin
  managedKubeSecretReferences:
    - secretName: pihole-password
      secretNamespace: external-dns
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          EXTERNAL_DNS_PIHOLE_PASSWORD: "{{ .password.Value }}"
